[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ljh-research-controller"
version = "0.1.0"
requires-python = ">=3.11"
description = "Replaceable reference research controller"
dependencies = ["ljh-research-core>=0.1,<0.2"]

[project.scripts]
ljh-research-controller = "ljh_research_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
