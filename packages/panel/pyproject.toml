[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ljh-research-panel"
version = "0.1.0"
requires-python = ">=3.11"
description = "Replaceable browser panel and local HTTP adapter"
dependencies = ["ljh-research-core>=0.1,<0.2"]

[project.scripts]
ljh-research-panel = "ljh_research_panel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ljh_research_panel = ["web/*"]
